[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zt-farming"
version = "1.0.0"
description = "Bulk ZeroTwo account creator and 9Router session/token/cookie harvester & farm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hazz-i" }]
keywords = ["zerotwo", "9router", "farming", "harvester", "automation", "openai-compatible", "cdp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27.0",
  "websockets>=12.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "tenacity>=8.3.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
shim = ["uvicorn>=0.30.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
zt-farming = "ztharvester.cli:_entry"
zt-harvester = "ztharvester.cli:_entry"

[project.urls]
Homepage = "https://github.com/Hazz-i/zt-farming"
Repository = "https://github.com/Hazz-i/zt-farming"
Documentation = "https://github.com/Hazz-i/zt-farming#readme"
Issues = "https://github.com/Hazz-i/zt-farming/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
